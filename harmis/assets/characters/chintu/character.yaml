# Chintu, a cheerful 9 year old boy
# Drop your own picture in this folder as custom.png to replace the generated one.
name: Chintu              # the name used in scripts
label:                    # how the name is shown on screen
  hindi: चिंटू
  english: Chintu
gender: m               # m / f (picks the voice)
age: child            # child / adult / old
type: human             # human / animal (used for the default mouth position)
seed: 1109              # fixed seed so the picture comes out the same
description: >-           # fixed look, added to every image prompt
  a cheerful 9 year old Indian boy with messy black hair and a big grin, wearing a blue
  t-shirt, khaki shorts and white sneakers
# Mouth and eyes position as fractions of the picture: [x, y, width, height].
# Found automatically (default for a human). Edit the numbers if the mouth moves in the wrong place
# (then delete the *_mouth_*.png / *_blink.png / *_variants.json files to remake them).
mouth_box: [0.44, 0.19, 0.12, 0.035]
eyes_box: [0.35, 0.125, 0.3, 0.05]
