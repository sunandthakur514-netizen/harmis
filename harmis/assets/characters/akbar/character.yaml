# Emperor Akbar from the Akbar-Birbal folk tales
# Drop your own picture in this folder as custom.png to replace the generated one.
name: Akbar              # the name used in scripts
label:                    # how the name is shown on screen
  hindi: अकबर
  english: Akbar
gender: m               # m / f (picks the voice)
age: adult            # child / adult / old
type: human             # human / animal (used for the default mouth position)
seed: 1101              # fixed seed so the picture comes out the same
description: >-           # fixed look, added to every image prompt
  a Mughal emperor in his 40s with a dignified, kind face, neatly trimmed black beard
  and moustache, wearing a rich maroon and gold jama robe, a pearl necklace and a
  jewelled white turban
# Mouth and eyes position as fractions of the picture: [x, y, width, height].
# Found automatically (head shape). Edit the numbers if the mouth moves in the wrong place
# (then delete the *_mouth_*.png / *_blink.png / *_variants.json files to remake them).
mouth_box: [0.475, 0.186, 0.143, 0.031]
eyes_box: [0.393, 0.114, 0.307, 0.041]
