# Every scene (background) that stories can use: scene name -> what it looks like.
# Pictures are generated once per style and cached here as <scene>__<style>.png.
# To use your own picture for a scene, save it here as <scene>.png.
# Descriptions must not contain people: characters are added on top.

# ----- everyday India -----
village_day: a sunny Indian village with mud houses, a big banyan tree, a well and green fields
gali: a narrow Indian residential lane (gali) with colourful houses, balconies with potted plants, a glass window, morning sunlight
living_room: a cosy Indian middle-class living room with a sofa, a ceiling fan, framed family photos and potted plants, daylight
school: a bright Indian school classroom with wooden desks, a blackboard and colourful charts on the walls
monsoon_village: an Indian village street in monsoon rain, puddles, wet green trees, dark rain clouds, a paper boat in a puddle
diwali_mela: a colourful Indian Diwali fair at dusk with a giant wheel, a balloon stall, sweet stalls with jalebi, glowing diyas and string lights

# ----- folk tales -----
palace_court: a grand Mughal palace court hall with white marble arches, red carpets, a golden throne and warm light
village_pond_night: a quiet Indian village pond on a cold winter night, mist over the water, moonlight, a tiny lamp glowing in a far-away palace window
birbal_courtyard: a simple courtyard of an old Indian house, a clay pot hanging very high on a tall wooden pole above a tiny cooking fire, daylight
riverbank_jamun: a riverbank in India with a big jamun tree full of purple fruits, a calm blue river, sunny day
river_water: the middle of a wide calm Indian river with gentle waves, distant green banks and a blue sky
tenali_garden_night: a South Indian village house garden at night with coconut trees, a stone well and moonlight
tenali_garden_morning: a South Indian village house garden in the morning with wet green plants and flowers, coconut trees, a stone well and sunshine
village_pond: a small pond with pink lotus flowers, reeds and trees in the Indian countryside, sunny day
sky_over_village: high in a blue sky with fluffy white clouds, a tiny Indian village and green fields far below
grassy_meadow: a soft green grassy meadow with wildflowers near an Indian village, sunny day

# ----- long stories -----
jungle_day: a lush green Indian jungle on a sunny day with tall trees, hanging vines, flowers and a small stream
lion_den: a big rocky cave entrance on a hillside in an Indian jungle, dry grass and boulders around it, afternoon light
jungle_meeting: a clearing under a huge old banyan tree with hanging roots in an Indian jungle, soft evening light
rabbit_home: a cosy little burrow home under the roots of a tree, wildflowers and soft grass around it
forest_path: a winding dirt path through an Indian forest with butterflies, flowers and dappled sunlight
old_well_jungle: an old round stone well with mossy steps in a forest clearing, clear water deep inside
jungle_celebration: an Indian jungle clearing at night decorated with glowing fireflies, flowers and fruit, festive and joyful
palace_exterior: the outside of a grand Mughal palace with domes, gardens and fountains on a bright morning
seth_haveli: the inside of a rich old Indian merchant's haveli, carved wooden pillars, a big iron money chest, brass lamps
servants_courtyard: the open stone courtyard of an old Indian haveli with a tulsi plant in the middle, arches around it, daylight
haveli_courtyard_night: the stone courtyard of an old Indian haveli at night, moonlight, quiet and peaceful, a tulsi plant in the middle
servant_room_night: a small simple servant's room in an old Indian house at night, a straw mat bed, a small oil lamp
servant_room_day: a small simple servant's room in an old Indian house in daylight, a straw mat bed, a clay pot

# ----- mild horror (teens and adults) -----
haveli_night: inside an old Indian haveli on a rainy night, carved wooden doors, flickering oil lamps, long shadows, mysterious but not gory
haveli_stairs_night: an old carved wooden staircase inside an Indian haveli at night, lit by a single torch beam, mysterious
city_bus_night: inside an empty old Indian city bus at night, dim yellow lights, rain on the windows
old_bridge_morning: an old stone bridge over a river in India on a misty early morning
