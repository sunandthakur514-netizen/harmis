# Render a video on GitHub's free runners and attach the mp4 to the run.
#
# Run it from the Actions tab: "make-video" -> "Run workflow". When it is done,
# download the video from the run page under "Artifacts".
# Pictures come from harmis/assets (run "prepare-pictures" first for new
# stories); missing ones are drawn in the simple shape style unless
# "make missing pictures" is ticked.
name: make-video

on:
  workflow_dispatch:
    inputs:
      story:
        description: Built-in story
        type: choice
        options: [monkey_crocodile, birbal_khichdi, tenali_thieves, talkative_tortoise, pyasa_kauwa,
                  kabutar_jaal, bagula_kekda, chuhe_hathi, bandar_mali, teetar_bado_ka_aadar,
                  birbal_kaue_ginti, birbal_lakeer, birbal_kuan, tenali_billi, tenali_kuan_shaadi,
                  tenali_hara_ghoda, chham_chham_baarish, diwali_mela, sooraj_dada, titli_rani,
                  daant_chamkao, phalon_ki_tokri, ginti_ke_tare, indradhanush, gali_cricket, dadi_smartphone,
                  haveli_paayal, aakhri_bus, sher_khargosh, birbal_lakdi, kauwa_saanp, chidiya_hathi,
                  sone_ka_hans, sone_ka_hiran, birbal_mom_ka_sher, tenali_vidwan]
      lang:
        description: Language (long stories are Hindi only)
        type: choice
        default: hindi
        options: [hindi, hinglish, english]
      style:
        description: Art style (auto = the genre's style from config.yaml)
        type: choice
        default: auto
        options: [auto, 3d_cartoon, storybook, anime]
      format:
        description: Video format (auto = the story's own format)
        type: choice
        default: auto
        options: [auto, short, long]
      make_missing_pictures:
        description: Make missing pictures with local_sd during this run (slower; they are NOT committed)
        type: boolean
        default: false

env:
  PYTHON_VERSION: "3.12"
  HF_HUB_DISABLE_TELEMETRY: "1"
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # voices, scene descriptions and (if free quota) pictures

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # SDXL Turbo on the CPU is slow (a few minutes per picture)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-local-sd.txt
      - name: Install system tools (ffmpeg; no espeak - robotic voices are never used here)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install HARMIS
        run: pip install -r requirements.txt
      - name: Install local_sd (CPU-only torch)
        if: inputs.make_missing_pictures
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-local-sd.txt
      - name: Restore models
        if: inputs.make_missing_pictures
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface
          key: hf-sdxl-turbo-fp16-v1
      - name: Restore rembg model
        uses: actions/cache/restore@v4
        with:
          path: ~/.u2net
          key: rembg-u2net-v1
      - name: Render the video
        run: |
          ARGS="--story ${{ inputs.story }} --lang ${{ inputs.lang }}"
          [ "${{ inputs.style }}" != "auto" ] && ARGS="$ARGS --style ${{ inputs.style }}"
          [ "${{ inputs.format }}" != "auto" ] && ARGS="$ARGS --format ${{ inputs.format }}"
          if [ "${{ inputs.make_missing_pictures }}" = "true" ]; then
            ARGS="$ARGS --providers gemini,local_sd"
          else
            ARGS="$ARGS --providers none"   # only pictures already in harmis/assets
          fi
          python -m harmis.main $ARGS
      - uses: actions/upload-artifact@v4
        with:
          name: harmis-video-${{ inputs.story }}-${{ inputs.lang }}
          path: output/*.mp4
          if-no-files-found: error
          retention-days: 30
