# Fully automatic publishing to YouTube, 3 times a day.
#
#   06:30 IST  short video     12:30 IST  long 5-7 minute video     18:30 IST  short video
#
# Every run:
#   1. If the upload queue (GitHub Release "queue", filled by bulk.yml) has videos,
#      upload up to 2 of them (oldest first, shorts and longs mixed) and delete
#      them from the queue. Nothing new is made in that run.
#   2. Only when the queue is empty: pick the next story that was never published,
#      make its pictures (local_sd), render it (Hindi, 3d_cartoon) and upload it.
# Never more than daily.max_uploads_per_day uploads (config.yaml, default 5) per
# YouTube quota day. Every upload is logged in output/published.csv, which is
# committed back together with state/daily.json and any new pictures.
# Needs the secrets YT_CLIENT_SECRET_JSON and YT_TOKEN_JSON (see README).
name: daily

on:
  schedule:                # GitHub cron is UTC; IST = UTC + 5:30
    - cron: "0 1 * * *"    # 06:30 IST -> short
    - cron: "0 7 * * *"    # 12:30 IST -> long
    - cron: "0 13 * * *"   # 18:30 IST -> short
  workflow_dispatch:
    inputs:
      slot:
        description: Type of a NEW video (auto = by the time of day in India)
        type: choice
        default: auto
        options: [auto, short, long]
      publish:
        description: Upload to YouTube (untick for a test run that only makes a video)
        type: boolean
        default: true

permissions:
  contents: write          # commit the upload log / pictures, and manage the "queue" release

concurrency:
  group: youtube-uploads
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  HF_HUB_DISABLE_TELEMETRY: "1"
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # voices, scene descriptions and (if free quota) pictures
  MODEL_CACHE_KEY: hf-sd-turbo-fp16-v1
  REMBG_CACHE_KEY: rembg-u2net-v1
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  UPLOAD: ${{ github.event_name == 'schedule' || inputs.publish }}

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-local-sd.txt
            requirements-publish.txt
      - name: Install system tools (ffmpeg; no espeak - robotic voices are never used here)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install HARMIS and the publishing packages
        run: pip install -r requirements.txt -r requirements-publish.txt

      - name: Write YouTube secrets to files (never printed)
        if: env.UPLOAD == 'true'
        env:
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          if [ -z "$YT_CLIENT_SECRET_JSON" ] || [ -z "$YT_TOKEN_JSON" ]; then
            echo "::error::The secrets YT_CLIENT_SECRET_JSON and YT_TOKEN_JSON are needed (see README)."
            exit 1
          fi
          umask 077
          mkdir -p ~/.config/harmis
          printf '%s' "$YT_CLIENT_SECRET_JSON" > client_secret.json
          printf '%s' "$YT_TOKEN_JSON" > ~/.config/harmis/youtube_token.json

      - name: Uploads left today
        id: budget
        run: |
          LEFT=$(python -m harmis.daily budget)
          echo "left=$LEFT" >> "$GITHUB_OUTPUT"
          echo "Uploads still allowed today: $LEFT" >> "$GITHUB_STEP_SUMMARY"

      # 1. The queue first. (The token is refreshed automatically when it has expired.)
      - name: Upload from the queue
        id: queue
        if: env.UPLOAD == 'true' && steps.budget.outputs.left != '0'
        run: |
          MAX=$(python -c 'from harmis.config import CONFIG; print(CONFIG.get("daily", {}).get("queue_uploads_per_run", 2))')
          python -m harmis.upload_queue publish --max "$MAX"
      - name: Queue summary
        if: always() && steps.queue.outcome != 'skipped'
        run: |
          echo "Queue: ${{ steps.queue.outputs.queued }} waiting, ${{ steps.queue.outputs.uploaded }} uploaded, ${{ steps.queue.outputs.failed }} failed" >> "$GITHUB_STEP_SUMMARY"

      # 2. Only when the queue is empty (or this is a test run): make a new video.
      - name: Pick the next unpublished story
        id: pick
        if: >-
          steps.budget.outputs.left != '0' &&
          (env.UPLOAD != 'true' || steps.queue.outputs.queued == '0')
        run: |
          SLOT="${{ inputs.slot || 'auto' }}"
          case "${{ github.event.schedule }}" in
            "0 7 * * *") SLOT=long ;;
            "0 1 * * *"|"0 13 * * *") SLOT=short ;;
          esac
          read -r STORY SLOT <<< "$(python -m harmis.daily next --slot "$SLOT")"
          LANG_=$(python -c 'from harmis.config import CONFIG; print(CONFIG.get("daily", {}).get("lang", "hindi"))')
          STYLE=$(python -c 'from harmis.config import CONFIG; print(CONFIG.get("daily", {}).get("style", "3d_cartoon"))')
          if [ "$STORY" = "none" ]; then
            echo "::warning::Every built-in $SLOT story has been published. Add new stories to harmis/samples*.py (or run bulk.yml after adding them)."
            echo "make=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "make=true" >> "$GITHUB_OUTPUT"
          echo "story=$STORY" >> "$GITHUB_OUTPUT"
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "args=--story $STORY --format $SLOT --lang $LANG_ --style $STYLE --providers gemini,local_sd" >> "$GITHUB_OUTPUT"
          echo "### New $SLOT video: $STORY ($LANG_, $STYLE)" >> "$GITHUB_STEP_SUMMARY"

      - name: Install CPU torch and local_sd
        if: steps.pick.outputs.make == 'true'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-local-sd.txt
      - name: Restore Stable Diffusion Turbo model
        if: steps.pick.outputs.make == 'true'
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ env.MODEL_CACHE_KEY }}
      - name: Restore rembg model
        if: steps.pick.outputs.make == 'true'
        id: rembg-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.u2net
          key: ${{ env.REMBG_CACHE_KEY }}
      - name: Make missing pictures (local_sd)
        if: steps.pick.outputs.make == 'true'
        continue-on-error: true   # a failed picture is retried by main, or drawn as shapes
        run: python -m harmis.prepare ${{ steps.pick.outputs.args }}
      - name: Save models to the cache (first time only)
        if: always() && steps.pick.outputs.make == 'true' && steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ env.MODEL_CACHE_KEY }}
      - name: Save rembg model to the cache (first time only)
        if: always() && steps.pick.outputs.make == 'true' && steps.rembg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.u2net
          key: ${{ env.REMBG_CACHE_KEY }}

      - name: Make the video
        id: video
        if: steps.pick.outputs.make == 'true'
        run: |
          python -m harmis.main ${{ steps.pick.outputs.args }} --offline
          VIDEO=$(ls -t output/*.mp4 | head -n 1)
          echo "video=$VIDEO" >> "$GITHUB_OUTPUT"
          echo "Video: \`$VIDEO\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: steps.pick.outputs.make == 'true'
        with:
          name: daily-${{ steps.pick.outputs.slot }}-${{ steps.pick.outputs.story }}-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*.json
          if-no-files-found: error
          retention-days: 3

      - name: Upload to YouTube
        id: publish
        if: steps.pick.outputs.make == 'true' && env.UPLOAD == 'true'
        run: python -m harmis.publish --video "${{ steps.video.outputs.video }}" --to youtube
      - name: Remember the story
        if: steps.publish.outcome == 'success'
        run: python -m harmis.daily done --slot ${{ steps.pick.outputs.slot }} --story ${{ steps.pick.outputs.story }}

      - name: Remove secret files
        if: always()
        run: rm -f client_secret.json ~/.config/harmis/youtube_token.json

      - name: Commit the upload log, rotation and new pictures
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in output/published.csv state/daily.json harmis/assets; do
            [ -e "$path" ] && git add "$path"
          done
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "daily: uploads ${{ steps.queue.outputs.uploaded || 0 }} from queue${{ steps.pick.outputs.story && format(', new {0} {1}', steps.pick.outputs.slot, steps.pick.outputs.story) || '' }} [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          echo "::error::Could not push the upload log; the next run may not know about these uploads."
          exit 1
