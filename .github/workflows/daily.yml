# Fully automatic publishing: makes a video and uploads it to YouTube 3 times a day.
#
#   06:30 IST  short video (Hindi, 3d_cartoon)
#   12:30 IST  long 5-7 minute video (Hindi, 3d_cartoon)
#   18:30 IST  short video (Hindi, 3d_cartoon)
#
# Stories come from the lists under "daily:" in config.yaml, in order, without
# repeats (the position is kept in state/daily.json and committed back). New
# pictures made by Stable Diffusion Turbo are committed too, so they are reused.
# Needs the secrets YT_CLIENT_SECRET_JSON and YT_TOKEN_JSON (see README,
# "Daily automation - required secrets"). Run it by hand from the Actions tab
# ("daily" -> "Run workflow") to test.
name: daily

on:
  schedule:                # GitHub cron is UTC; IST = UTC + 5:30
    - cron: "0 1 * * *"    # 06:30 IST -> short
    - cron: "0 7 * * *"    # 12:30 IST -> long
    - cron: "0 13 * * *"   # 18:30 IST -> short
  workflow_dispatch:
    inputs:
      slot:
        description: Video type (auto = by the time of day in India)
        type: choice
        default: auto
        options: [auto, short, long]
      publish:
        description: Upload to YouTube (untick for a test run that only makes the video)
        type: boolean
        default: true

permissions:
  contents: write          # to commit state/daily.json and new pictures

concurrency:
  group: daily
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  HF_HUB_DISABLE_TELEMETRY: "1"
  MODEL_CACHE_KEY: hf-sd-turbo-fp16-v1
  REMBG_CACHE_KEY: rembg-u2net-v1

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-local-sd.txt
            requirements-publish.txt

      - name: Install system tools (ffmpeg, espeak-ng fallback voice)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - name: Install HARMIS, CPU torch, local_sd and publishing packages
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-local-sd.txt -r requirements-publish.txt

      # Models are downloaded once and then restored from the cache.
      - name: Restore Stable Diffusion Turbo model
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ env.MODEL_CACHE_KEY }}
      - name: Restore rembg model
        id: rembg-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.u2net
          key: ${{ env.REMBG_CACHE_KEY }}

      - name: Pick the next story
        id: pick
        run: |
          SLOT="${{ inputs.slot || 'auto' }}"
          case "${{ github.event.schedule }}" in
            "0 7 * * *") SLOT=long ;;
            "0 1 * * *"|"0 13 * * *") SLOT=short ;;
          esac
          read -r STORY SLOT <<< "$(python -m harmis.daily next --slot "$SLOT")"
          LANG_=$(python -c 'from harmis.config import CONFIG; print(CONFIG.get("daily", {}).get("lang", "hindi"))')
          STYLE=$(python -c 'from harmis.config import CONFIG; print(CONFIG.get("daily", {}).get("style", "3d_cartoon"))')
          echo "story=$STORY" >> "$GITHUB_OUTPUT"
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "args=--story $STORY --format $SLOT --lang $LANG_ --style $STYLE --providers local_sd" >> "$GITHUB_OUTPUT"
          echo "### $SLOT video: $STORY ($LANG_, $STYLE)" >> "$GITHUB_STEP_SUMMARY"

      - name: Make missing pictures (local_sd)
        # A picture that fails is retried by main and, if needed, drawn as shapes.
        continue-on-error: true
        run: python -m harmis.prepare ${{ steps.pick.outputs.args }}

      - name: Save models to the cache (first time only)
        if: always() && steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ env.MODEL_CACHE_KEY }}
      - name: Save rembg model to the cache (first time only)
        if: always() && steps.rembg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.u2net
          key: ${{ env.REMBG_CACHE_KEY }}

      - name: Make the video
        id: video
        run: |
          python -m harmis.main ${{ steps.pick.outputs.args }} --offline
          VIDEO=$(ls -t output/*.mp4 | head -n 1)
          echo "video=$VIDEO" >> "$GITHUB_OUTPUT"
          echo "Video: \`$VIDEO\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: daily-${{ steps.pick.outputs.slot }}-${{ steps.pick.outputs.story }}-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*.json
          if-no-files-found: error
          retention-days: 3

      - name: Write YouTube secrets to files (never printed)
        if: github.event_name == 'schedule' || inputs.publish
        env:
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          if [ -z "$YT_CLIENT_SECRET_JSON" ] || [ -z "$YT_TOKEN_JSON" ]; then
            echo "::error::The secrets YT_CLIENT_SECRET_JSON and YT_TOKEN_JSON are needed (see README)."
            exit 1
          fi
          umask 077
          mkdir -p ~/.config/harmis
          printf '%s' "$YT_CLIENT_SECRET_JSON" > client_secret.json
          printf '%s' "$YT_TOKEN_JSON" > ~/.config/harmis/youtube_token.json

      - name: Upload to YouTube
        id: publish
        if: github.event_name == 'schedule' || inputs.publish
        # The token in the file is refreshed automatically when it has expired;
        # the refresh token itself stays valid, so the secret never needs updating.
        run: python -m harmis.publish --video "${{ steps.video.outputs.video }}" --to youtube

      - name: Remove secret files
        if: always()
        run: rm -f client_secret.json ~/.config/harmis/youtube_token.json

      - name: Remember the story (only after a successful upload)
        if: steps.publish.outcome == 'success'
        run: python -m harmis.daily done --slot ${{ steps.pick.outputs.slot }} --story ${{ steps.pick.outputs.story }}

      - name: Commit the rotation and new pictures
        if: always() && steps.pick.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898208+github-actions[bot]@users.noreply.github.com"
          git add state/daily.json harmis/assets 2>/dev/null || git add harmis/assets
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "daily: ${{ steps.pick.outputs.slot }} ${{ steps.pick.outputs.story }} [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          echo "::warning::Could not push the rotation / pictures."
