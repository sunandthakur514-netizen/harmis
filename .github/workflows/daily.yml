# Fully automatic publishing to YouTube: SHORTS ONLY, 5 times a day.
#
#   07:37  10:37  13:37  17:37  20:37 IST   (cron is UTC: 02:07 05:07 08:07 12:07 15:07)
#
# Every run makes ONE new short and uploads it:
#   * the story: Gemini writes a NEW one for today's theme (Mon moral fable, Tue
#     Chintu & Golu, Wed mythology, Thu fairy tale, Fri little detective, Sat science,
#     Sun rhyme); 2 shorts a day are mythology (all on Wednesday), see config.yaml
#   * Hindi, 3d_cartoon, scene pictures, Gemini / edge-tts voices, music and effects
#   * harmis/make_short.py checks the video; if it is not good it tries once more,
#     and if that fails too the slot is skipped - nothing broken is ever uploaded
# Long videos are never made or uploaded automatically. At most
# daily.max_uploads_per_day (5) uploads per YouTube quota day. Every upload is
# logged in output/published.csv and committed with state/daily.json.
# Needs the secrets YT_CLIENT_SECRET_JSON, YT_TOKEN_JSON and GEMINI_API_KEY (see README).
name: daily

on:
  schedule:                # GitHub cron is UTC; IST = UTC + 5:30
    - cron: "7 2 * * *"    # 07:37 IST
    - cron: "7 5 * * *"    # 10:37 IST
    - cron: "7 8 * * *"    # 13:37 IST
    - cron: "7 12 * * *"   # 17:37 IST
    - cron: "7 15 * * *"   # 20:37 IST
  workflow_dispatch:
    inputs:
      publish:
        description: Upload to YouTube (untick for a test run that only makes the short)
        type: boolean
        default: true

permissions:
  contents: write          # commit the upload log, rotation state and pictures

concurrency:
  group: youtube-uploads
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  HF_HUB_DISABLE_TELEMETRY: "1"
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # stories, voices, scene descriptions
  MODEL_CACHE_KEY: hf-sdxl-turbo-fp16-v1
  REMBG_CACHE_KEY: rembg-u2net-v1
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  UPLOAD: ${{ github.event_name == 'schedule' || inputs.publish }}

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 240   # up to 2 attempts with SDXL Turbo on the CPU
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-local-sd.txt
            requirements-publish.txt
      - name: Install system tools (ffmpeg; no espeak - robotic voices are never used here)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install HARMIS and the publishing packages
        run: pip install -r requirements.txt -r requirements-publish.txt

      - name: Uploads left today
        id: budget
        run: |
          LEFT=$(python -m harmis.daily budget)
          echo "left=$LEFT" >> "$GITHUB_OUTPUT"
          echo "Uploads still allowed today: $LEFT" >> "$GITHUB_STEP_SUMMARY"

      - name: Install CPU torch and local_sd
        if: steps.budget.outputs.left != '0'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-local-sd.txt
      - name: Restore SDXL Turbo model
        if: steps.budget.outputs.left != '0'
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ env.MODEL_CACHE_KEY }}
      - name: Restore rembg model
        if: steps.budget.outputs.left != '0'
        id: rembg-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.u2net
          key: ${{ env.REMBG_CACHE_KEY }}

      - name: Make one short (retried once, skipped if still not good)
        id: short
        if: steps.budget.outputs.left != '0'
        run: python -m harmis.make_short --out output --tries 2
      - name: Summary
        if: always() && steps.short.outcome != 'skipped'
        run: |
          if [ "${{ steps.short.outputs.made }}" = "true" ]; then
            echo "### Short: ${{ steps.short.outputs.story }} (theme ${{ steps.short.outputs.theme }} ${{ steps.short.outputs.topic }}, attempt ${{ steps.short.outputs.attempt }})" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### No good short this slot - skipped, nothing uploaded" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save models to the cache (first time only)
        if: always() && steps.budget.outputs.left != '0' && steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ env.MODEL_CACHE_KEY }}
      - name: Save rembg model to the cache (first time only)
        if: always() && steps.budget.outputs.left != '0' && steps.rembg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.u2net
          key: ${{ env.REMBG_CACHE_KEY }}
      - uses: actions/upload-artifact@v4
        if: steps.short.outputs.made == 'true'
        with:
          name: daily-short-${{ steps.short.outputs.story }}-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*.json
          retention-days: 3

      - name: Write YouTube secrets to files (never printed)
        if: steps.short.outputs.made == 'true' && env.UPLOAD == 'true'
        env:
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          if [ -z "$YT_CLIENT_SECRET_JSON" ] || [ -z "$YT_TOKEN_JSON" ]; then
            echo "::error::The secrets YT_CLIENT_SECRET_JSON and YT_TOKEN_JSON are needed (see README)."
            exit 1
          fi
          umask 077
          mkdir -p ~/.config/harmis
          printf '%s' "$YT_CLIENT_SECRET_JSON" > client_secret.json
          printf '%s' "$YT_TOKEN_JSON" > ~/.config/harmis/youtube_token.json
      - name: Upload the short to YouTube
        id: publish
        if: steps.short.outputs.made == 'true' && env.UPLOAD == 'true'
        run: python -m harmis.publish --video "${{ steps.short.outputs.video }}" --to youtube
      - name: Remember the story
        if: steps.publish.outcome == 'success'
        run: python -m harmis.daily done --slot short --story "${{ steps.short.outputs.story }}"
      - name: Remove secret files
        if: always()
        run: rm -f client_secret.json ~/.config/harmis/youtube_token.json

      - name: Commit the upload log, rotation and new pictures
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in output/published.csv state/daily.json harmis/assets; do
            [ -e "$path" ] && git add "$path"
          done
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "daily: short ${{ steps.short.outputs.story || 'skipped' }} [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          echo "::error::Could not push the upload log; the next run may not know about this upload."
          exit 1
