# Make all missing pictures for a story on GitHub's free runners and commit them
# to the repo (harmis/assets/...), so every later video reuses them.
#
# Run it from the Actions tab: "prepare-pictures" -> "Run workflow".
#   1. list:     finds which scene / character pictures are still missing
#   2. generate: one job per missing picture (up to 5 at a time), each running
#                Stable Diffusion Turbo (local_sd) on the runner's CPU
#   3. commit:   collects the new pictures and commits them
name: prepare-pictures

on:
  workflow_dispatch:
    inputs:
      story:
        description: Built-in story
        type: choice
        options: [monkey_crocodile, birbal_khichdi, tenali_thieves, talkative_tortoise, pyasa_kauwa,
                  kabutar_jaal, bagula_kekda, chuhe_hathi, bandar_mali, teetar_bado_ka_aadar,
                  birbal_kaue_ginti, birbal_lakeer, birbal_kuan, tenali_billi, tenali_kuan_shaadi,
                  tenali_hara_ghoda, chham_chham_baarish, diwali_mela, sooraj_dada, titli_rani,
                  daant_chamkao, phalon_ki_tokri, ginti_ke_tare, indradhanush, gali_cricket, dadi_smartphone,
                  haveli_paayal, aakhri_bus, sher_khargosh, birbal_lakdi, kauwa_saanp, chidiya_hathi,
                  sone_ka_hans, sone_ka_hiran, birbal_mom_ka_sher, tenali_vidwan]
      style:
        description: Art style (auto = the genre's style from config.yaml)
        type: choice
        default: auto
        options: [auto, 3d_cartoon, storybook, anime]
      format:
        description: Video format (auto = the story's own format)
        type: choice
        default: auto
        options: [auto, short, long]

concurrency:
  group: prepare-pictures-${{ inputs.story }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"   # torch's CPU wheels are most reliable here; HARMIS itself also runs on 3.14
  HF_HUB_DISABLE_TELEMETRY: "1"
  MODEL_CACHE_KEY: hf-sdxl-turbo-fp16-v1
  REMBG_CACHE_KEY: rembg-u2net-v1

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      items: ${{ steps.list.outputs.items }}
      count: ${{ steps.list.outputs.count }}
      args: ${{ steps.args.outputs.args }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install HARMIS (light, no torch needed to list)
        run: pip install -r requirements.txt
      - name: Build command line options
        id: args
        run: |
          ARGS="--story ${{ inputs.story }}"
          [ "${{ inputs.style }}" != "auto" ] && ARGS="$ARGS --style ${{ inputs.style }}"
          [ "${{ inputs.format }}" != "auto" ] && ARGS="$ARGS --format ${{ inputs.format }}"
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
      - name: List missing pictures
        id: list
        run: |
          python -m harmis.prepare ${{ steps.args.outputs.args }} --providers none --list-file missing.json
          echo "items=$(cat missing.json)" >> "$GITHUB_OUTPUT"
          echo "count=$(python -c 'import json; print(len(json.load(open("missing.json"))))')" >> "$GITHUB_OUTPUT"

      # Download the models once here, so the parallel jobs below only restore them.
      - name: Cache SDXL Turbo model
        if: steps.list.outputs.count != '0'
        id: model-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ env.MODEL_CACHE_KEY }}
      - name: Download SDXL Turbo (first time only, ~7 GB)
        if: steps.list.outputs.count != '0' && steps.model-cache.outputs.cache-hit != 'true'
        run: |
          pip install huggingface_hub
          python -c "from huggingface_hub import snapshot_download; snapshot_download('stabilityai/sdxl-turbo', allow_patterns=['*.json', '*.txt', '*.fp16.safetensors'])"
      - name: Cache rembg model
        if: steps.list.outputs.count != '0'
        id: rembg-cache
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: ${{ env.REMBG_CACHE_KEY }}
      - name: Download rembg model (first time only)
        if: steps.list.outputs.count != '0' && steps.rembg-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.u2net
          curl -sSL -o ~/.u2net/u2net.onnx https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2net.onnx

  generate:
    needs: list
    if: needs.list.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false      # one failed picture must not stop the others
      max-parallel: 5
      matrix:
        item: ${{ fromJSON(needs.list.outputs.items) }}
    name: generate ${{ matrix.item }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-local-sd.txt
      - name: Install HARMIS + local_sd (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-local-sd.txt
      - name: Restore SDXL Turbo model
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ env.MODEL_CACHE_KEY }}
      - name: Restore rembg model
        uses: actions/cache/restore@v4
        with:
          path: ~/.u2net
          key: ${{ env.REMBG_CACHE_KEY }}
      - name: Make the picture
        run: python -m harmis.prepare ${{ needs.list.outputs.args }} --providers local_sd --only "${{ matrix.item }}"
      - name: Collect the new files
        if: always()
        run: |
          mkdir -p out
          git ls-files --others --modified --exclude-standard harmis/assets | xargs -r cp --parents -t out/
          find out -type f
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pictures-${{ strategy.job-index }}
          path: out/
          if-no-files-found: warn
          retention-days: 3

  commit:
    needs: [list, generate]
    if: always() && needs.list.outputs.count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true   # every picture job may have failed
        with:
          pattern: pictures-*
          merge-multiple: true
          path: .
      - name: Commit the new pictures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harmis/assets
          if git diff --cached --quiet; then
            echo "No new pictures to commit."
            exit 0
          fi
          git diff --cached --stat
          git commit -m "Add pictures for ${{ inputs.story }} (prepare-pictures workflow)"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
