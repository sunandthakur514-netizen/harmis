# HARMIS settings. Change these without touching the code.
# Command line options (--lang, --style, --providers) win over this file.

defaults:
  lang: hindi            # hindi | hinglish | english
  style: 3d_cartoon      # storybook | 3d_cartoon | anime
  output_dir: output

video:
  crossfade_seconds: 0.6 # fade between scenes
  chunk_seconds: 60      # long videos are rendered in pieces of this length (keeps memory low)

# Video formats (--format short | long)
formats:
  short:                 # YouTube Shorts / Instagram Reels
    width: 1080
    height: 1920
    fps: 30
    min_seconds: 30      # shorter videos get a longer ending card
    max_seconds: 60      # longer stories are swapped for a built-in one
  long:                  # normal YouTube video
    width: 1920
    height: 1080
    fps: 24
    min_seconds: 300     # 5 minutes (just a warning if the story is shorter)
    max_seconds: 420     # 7 minutes (just a warning if the story is longer)
    intro_seconds: 4     # title card at the start
    outro_seconds: 7     # "Like & Subscribe" card at the end

# ---------------------------------------------------------------------------
# Image providers, tried in this order for every picture.
# A video is ALWAYS made: if every provider fails, HARMIS draws simple
# shape characters and coloured backgrounds instead.
# ---------------------------------------------------------------------------
image_providers:
  order: [pollinations, gemini, huggingface]
  # Stop asking a provider after this many REAL errors in a row in one run.
  # Rate limits (HTTP 429), timeouts and busy servers never count.
  disable_after_failures: 3

  # Settings for every provider:
  #   timeout:          seconds to wait for one picture
  #   tries:            attempts per picture (rate limits and timeouts are retried)
  #   delay_seconds:    pause between two requests (requests are always one at a time)
  #   backoff_seconds:  first wait after a rate limit; doubles on every new try

  pollinations:               # free, no key needed; set POLLINATIONS_TOKEN for higher limits
    url: https://image.pollinations.ai/prompt/{prompt}
    model: flux
    timeout: 120
    tries: 4
    delay_seconds: 15
    backoff_seconds: 20

  gemini:                     # needs the GEMINI_API_KEY environment variable
    model: gemini-2.5-flash-image
    timeout: 120
    tries: 3
    delay_seconds: 5
    backoff_seconds: 20

  huggingface:                # needs the HF_TOKEN environment variable (free account)
    url: https://router.huggingface.co/hf-inference/models/{model}
    model: black-forest-labs/FLUX.1-schnell
    timeout: 120
    tries: 3
    delay_seconds: 5
    backoff_seconds: 20

# Character pictures get their background removed so they can stand on any scene.
background_removal:
  rembg_model: u2net          # if rembg is not installed, a simple white-background cut is used

# ---------------------------------------------------------------------------
# Art styles. The chosen style is added to every image prompt.
# ---------------------------------------------------------------------------
styles:
  storybook: >-
    children's storybook illustration, soft watercolour and gouache painting,
    warm colours, gentle outlines, hand-painted texture
  3d_cartoon: >-
    3D animated movie style render, cute stylised proportions, big expressive eyes,
    soft studio lighting, smooth shading, vibrant colours, high quality CGI
  anime: >-
    anime style illustration, clean line art, cel shading, bright colours,
    expressive eyes

# ---------------------------------------------------------------------------
# Kid safety. These words are added to EVERY image prompt, and the blocked words
# are removed from every prompt (no copyrighted characters or brands).
# ---------------------------------------------------------------------------
safety:
  always_add: >-
    kid-friendly, wholesome, family-safe, non-violent, modest clothing, no gore,
    no blood, no weapons, original character design, no text, no logo, no watermark
  negative: >-
    nsfw, nudity, gore, blood, violence, weapon, horror face, text, letters,
    watermark, logo, signature, copyrighted character
  blocked_words: [disney, pixar, dreamworks, ghibli, marvel, mickey, minnie, elsa,
                  frozen, shrek, pokemon, pikachu, naruto, doraemon, shinchan,
                  chhota bheem, motu patlu, peppa, spongebob, barbie, superman,
                  batman, spiderman, spider-man, harry potter, minion]

# ---------------------------------------------------------------------------
# Genre settings
#   style:          art style for this genre (unless --style is given)
#   narrator:       character from harmis/assets/characters/ shown while narrating
#   narrator_voice: speed (%) and pitch (Hz) changes for the narrator's voice
#   default_scene:  background used when a line has no scene
#   mood:           added to background prompts
# ---------------------------------------------------------------------------
genres:
  kids_story:
    style: 3d_cartoon
    narrator: narrator
    narrator_voice: {rate: -5, pitch: 0}
    default_scene: village_day
    mood: bright cheerful daylight, warm happy colours
  kids_rhyme:
    style: 3d_cartoon
    narrator: narrator
    narrator_voice: {rate: -5, pitch: 8}
    default_scene: village_day
    mood: bright cheerful colours, playful
  comedy:
    style: 3d_cartoon
    narrator: narrator_comedy
    narrator_voice: {rate: 5, pitch: 0}
    default_scene: gali
    mood: bright sunny colours, fun
  horror:
    style: storybook
    narrator: narrator_horror
    narrator_voice: {rate: -15, pitch: -10}
    default_scene: haveli_night
    mood: dark moonlit night, mysterious and mildly spooky, suitable for teenagers, no gore
