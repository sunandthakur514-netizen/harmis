# HARMIS settings. Change these without touching the code.
# Command line options (--lang, --style, --providers) win over this file.

defaults:
  lang: hindi            # hindi | hinglish | english
  style: 3d_cartoon      # storybook | 3d_cartoon | anime
  output_dir: output

video:
  crossfade_seconds: 0.6 # fade between scenes
  chunk_seconds: 60      # long videos are rendered in pieces of this length (keeps memory low)

# Video formats (--format short | long)
formats:
  short:                 # YouTube Shorts / Instagram Reels
    width: 1080
    height: 1920
    fps: 30
    min_seconds: 30      # shorter videos get a longer ending card
    max_seconds: 60      # longer stories are swapped for a built-in one
  long:                  # normal YouTube video
    width: 1920
    height: 1080
    fps: 24
    min_seconds: 300     # 5 minutes (just a warning if the story is shorter)
    max_seconds: 420     # 7 minutes (just a warning if the story is longer)
    intro_seconds: 4     # title card at the start
    outro_seconds: 7     # "Like & Subscribe" card at the end

# ---------------------------------------------------------------------------
# Image providers, tried in this order for every picture.
# A video is ALWAYS made: if every provider fails, HARMIS draws simple
# shape characters and coloured backgrounds instead.
# ---------------------------------------------------------------------------
image_providers:
  # Order to try them in. "shapes" (drawn by HARMIS) is always the last resort.
  order: [gemini, local_sd, pollinations, huggingface]
  # Stop asking a provider after this many REAL errors in a row in one run.
  # Rate limits (HTTP 429), timeouts and busy servers never count.
  disable_after_failures: 3

  # Settings for every provider:
  #   timeout:          seconds to wait for one picture
  #   tries:            attempts per picture (rate limits and timeouts are retried)
  #   delay_seconds:    pause between two requests (requests are always one at a time)
  #   backoff_seconds:  first wait after a rate limit; doubles on every new try

  pollinations:               # free, no key needed; set POLLINATIONS_TOKEN for higher limits
    url: https://image.pollinations.ai/prompt/{prompt}
    model: flux
    timeout: 120
    tries: 4
    delay_seconds: 15
    backoff_seconds: 20

  local_sd:                   # Stable Diffusion XL Turbo on your own CPU: free and unlimited.
                              # Optional: pip install -r requirements-local-sd.txt (see README)
    model: stabilityai/sdxl-turbo
    variant: fp16             # download the half-size files (turned into full precision for the CPU)
    steps: 4                  # 1-8
    guidance: 1.5             # above 1 the negative prompt works (no hybrids); 0 = twice as fast
    size: 512                 # short side of the picture the model makes (then enlarged)
    max_side: 896             # long side: 512x896 for tall / wide pictures
    threads: 0                # CPU threads to use; 0 = all
    cache_dir: null           # where the model is stored; null = the normal Hugging Face cache
    tries: 1                  # a local model does not get better by retrying
    delay_seconds: 0

  gemini:                     # needs GEMINI_API_KEY; gets the character pictures as references.
                              # If the key has no free image quota, it is skipped for the run
                              # at the first "quota" answer and local_sd makes the pictures.
    model: gemini-2.5-flash-image
    timeout: 120
    tries: 3
    delay_seconds: 5
    backoff_seconds: 20

  huggingface:                # needs the HF_TOKEN environment variable (free account)
    url: https://router.huggingface.co/hf-inference/models/{model}
    model: black-forest-labs/FLUX.1-schnell
    timeout: 120
    tries: 3
    delay_seconds: 5
    backoff_seconds: 20

# ---------------------------------------------------------------------------
# Voices (harmis/voice.py). Engines are tried in this order for a whole story.
# Inside GitHub Actions espeak is never used: the run fails instead.
# ---------------------------------------------------------------------------
voice:
  engines: [gemini, edge, espeak]
  edge_tries: 3               # edge-tts attempts per line (waits 2 s, then 4 s)
  allow_espeak: true          # on your own computer only
  gemini:                     # needs GEMINI_API_KEY (free tier). Clips are cached in cache/tts/.
    models: [gemini-2.5-flash-preview-tts]   # first one that exists is used; add newer ones in front
    delay_seconds: 7          # pause between requests (free tier allows only a few per minute)
    tries: 5                  # per line; rate limits wait as long as Google asks
    timeout: 120
    narrator_voices:          # prebuilt Gemini voices for the narrator of each genre
      kids_story: Sulafat     # warm
      kids_rhyme: Laomedeia   # upbeat
      comedy: Puck            # upbeat
      horror: Enceladus       # breathy
    narrator_style:
      horror: Tell this mystery story slowly in a low, suspenseful, whispery storyteller voice
      comedy: Tell this funny family story with playful comic timing and a smile in the voice
    # Characters get a voice that suits their gender and age, different for each one.
    # To choose one yourself, add  gemini_voice: Puck  to their character.yaml.

# ---------------------------------------------------------------------------
# Scene pictures (harmis/shots.py): one full picture per part of the story,
# showing the characters acting in it.
# ---------------------------------------------------------------------------
shots:
  max_lines_per_shot: {short: 3, long: 4}   # a new picture at least this often
  planner_model: gemini-2.5-flash           # writes what each picture shows (1 request per story)
  # Local models (local_sd) mix different animals into hybrids, so a local picture
  # shows only ONE kind of character. A scene with two kinds becomes:
  #   closeups: one close-up per character, shown in turn (whoever speaks is shown)
  #   wide:     one wide picture with each character in its own place (left / right)
  local_sd_mode: closeups

# ---------------------------------------------------------------------------
# Sound (harmis/sound.py): music and effects are CC0, made by tools/make_sounds.py
# ---------------------------------------------------------------------------
audio:
  music:                      # harmis/assets/music/<name>.ogg per genre (null = no music)
    kids_story: lullaby
    kids_rhyme: playful
    comedy: playful
    horror: null
  music_volume: 0.14          # between lines
  music_under_voice: 0.07     # while someone speaks
  effects_volume: 0.35
  effects:                    # harmis/assets/sfx/<name>.ogg plays when a line contains one of these
    splash: ["छपाक", "छप से", "पानी में कूद", "पानी में गिर", "कीचड़ में", "डुबकी", "splash"]
    whoosh: ["उड़", "हवा में", "फुर्र", "दौड़", "भागा", "भागे", "भागी", "fly", "flew", "whoosh"]
    laugh: ["हा हा", "हाहा", "ही ही", "हँस", "हँसी", "laugh", "giggle"]
    thud: ["धम", "धड़ाम", "गिर", "thud", "fell"]
    twinkle: ["जादू", "चमक", "सोने का", "सोने की", "सोने के", "सुनहर", "तारे", "magic", "sparkle", "golden"]
    boing: ["उछल", "कूद", "bounce", "jump"]
    pop: ["पॉप", "pop"]

# Character pictures get their background removed so they can stand on any scene.
background_removal:
  rembg_model: u2net          # if rembg is not installed, a simple white-background cut is used

# ---------------------------------------------------------------------------
# Art styles. The chosen style is added to every image prompt.
# ---------------------------------------------------------------------------
styles:
  storybook: >-
    children's storybook illustration, soft watercolour and gouache painting,
    warm colours, gentle outlines, hand-painted texture
  3d_cartoon: >-
    3D animated movie style render, cute stylised proportions, big expressive eyes,
    soft studio lighting, smooth shading, vibrant colours, high quality CGI
  anime: >-
    anime style illustration, clean line art, cel shading, bright colours,
    expressive eyes

# ---------------------------------------------------------------------------
# Kid safety. These words are added to EVERY image prompt, and the blocked words
# are removed from every prompt (no copyrighted characters or brands).
# ---------------------------------------------------------------------------
safety:
  always_add: >-
    kid-friendly, wholesome, family-safe, non-violent, modest clothing, no gore,
    no blood, no weapons, original character design, no text, no logo, no watermark
  negative: >-
    nsfw, nudity, gore, blood, violence, weapon, horror face, text, letters,
    watermark, logo, signature, copyrighted character, hybrid, merged animals,
    extra heads, deformed, two animals fused, mutated, extra limbs, duplicate
  blocked_words: [disney, pixar, dreamworks, ghibli, marvel, mickey, minnie, elsa,
                  frozen, shrek, pokemon, pikachu, naruto, doraemon, shinchan,
                  chhota bheem, motu patlu, peppa, spongebob, barbie, superman,
                  batman, spiderman, spider-man, harry potter, minion]

# ---------------------------------------------------------------------------
# Genre settings
#   style:          art style for this genre (unless --style is given)
#   narrator:       character from harmis/assets/characters/ shown while narrating
#   narrator_voice: speed (%) and pitch (Hz) changes for the narrator's voice
#   default_scene:  background used when a line has no scene
#   mood:           added to background prompts
# ---------------------------------------------------------------------------
genres:
  kids_story:
    style: 3d_cartoon
    narrator: narrator
    narrator_voice: {rate: -5, pitch: 0}
    default_scene: village_day
    mood: bright cheerful daylight, warm happy colours
  kids_rhyme:
    style: 3d_cartoon
    narrator: narrator
    narrator_voice: {rate: -5, pitch: 8}
    default_scene: village_day
    mood: bright cheerful colours, playful
  comedy:
    style: 3d_cartoon
    narrator: narrator_comedy
    narrator_voice: {rate: 5, pitch: 0}
    default_scene: gali
    mood: bright sunny colours, fun
  horror:
    style: storybook
    narrator: narrator_horror
    narrator_voice: {rate: -15, pitch: -10}
    default_scene: haveli_night
    mood: dark moonlit night, mysterious and mildly spooky, suitable for teenagers, no gore

# ---------------------------------------------------------------------------
# Story themes by weekday (India time). Each run asks Gemini (GEMINI_API_KEY) to
# write a NEW original Hindi story for today's theme (harmis/storygen.py); if
# that fails 3 times, an unpublished built-in story is used instead.
#   genre:      the HARMIS genre it is made as (style, narrator voice, music)
#   brief:      what Gemini is asked to write
#   characters: characters it must use (they look the same in every video)
#   allowed:    characters it may use (from harmis/assets/characters)
#   fallback:   which built-in stories fit when Gemini fails (sources)
# No horror on this made-for-kids channel.
# ---------------------------------------------------------------------------
weekdays:                     # 0 = Monday ... 6 = Sunday
  0: {short: moral, long: moral}
  1: {short: kids_comedy, long: kids_comedy}
  2: {short: mythology, long: mythology}
  3: {short: fairy_tale, long: fairy_tale}
  4: {short: mystery, long: mystery}
  5: {short: science, long: science}
  6: {short: rhyme, long: riddle}

themes:
  moral:
    genre: kids_story
    label: {hindi: पंचतंत्र जैसी एक कहानी, english: Moral Story}
    brief: >-
      a NEW original animal fable in the style of the Panchatantra or Jataka tales, set in an
      Indian jungle, river or village, where clever or kind animals solve a problem; it must
      end with a clear moral
    fallback_sources: [Panchatantra, Jataka]
    mood: bright cheerful daylight, warm happy colours
  kids_comedy:
    genre: kids_story
    label: {hindi: चिंटू-गोलू की मज़ेदार कहानी, english: Funny Kids Story}
    brief: >-
      a NEW funny everyday-life comedy about two best friends, Chintu and Golu (both about
      8-9 years old), with a silly misunderstanding or plan that goes wrong and a happy,
      laugh-out-loud ending; gentle humour, nobody is mocked or hurt; end with a small lesson
    characters: [chintu, golu]
    allowed: [dadi, pinky, sharma_uncle]
    fallback_sources: []
    mood: bright sunny colours, fun and playful
  mythology:
    genre: kids_story
    label: {hindi: बच्चों के लिए पौराणिक कथा, english: Mythology for Kids}
    brief: >-
      a gentle, respectful story for children about little Krishna, young Hanuman or little
      Ganesha, based on a well-known traditional episode (for example Krishna and the butter
      pot, Krishna lifting Govardhan to shelter the village, Hanuman's childhood leap towards
      the sun, Ganesha going around his parents, Ganesha and the moon) told warmly; show the
      deities with deep love and respect as wise, kind and joyful; no jokes at their expense,
      no fighting, no demons, no violence; end with a value such as kindness, devotion or wisdom
    allowed: [bal_krishna, bal_hanuman, bal_ganesha]
    fallback_sources: []
    mood: divine soft golden light, peaceful, joyful
  fairy_tale:
    genre: kids_story
    label: {hindi: परी और जादू की कहानी, english: Fairy Tale}
    brief: >-
      a NEW original Indian fairy tale with a kind pari (fairy), a little magic and a brave,
      kind child, set in a village, forest or palace garden; wonder and kindness, nothing scary;
      end with a moral
    allowed: [pari, pinky, chintu, dadi]
    fallback_sources: []
    mood: magical sparkling light, dreamy pastel colours
  mystery:
    genre: kids_story
    label: {hindi: नन्हे जासूस की कहानी, english: Little Detective Mystery}
    brief: >-
      a NEW little detective mystery for children: clever kids find clues and solve a gentle
      puzzle (a missing toy, missing ladoos, a strange sound that turns out to be a kitten);
      NOT scary, no crime, no danger, nobody is hurt; the answer is funny or sweet; end with a
      lesson about observing carefully or being honest
    allowed: [chintu, golu, pinky, dadi, sharma_uncle]
    fallback_sources: []
    mood: bright daylight, curious and playful
  science:
    genre: kids_story
    label: {hindi: विज्ञान और अंतरिक्ष की सैर, english: Science Adventure}
    brief: >-
      a NEW science or space adventure for children (for example a trip to the Moon, why the
      sky is blue, how plants drink water, the water cycle) that teaches ONE real, correct
      science fact in a fun way; Indian child heroes; nothing scary; end with what we learned
    allowed: [chintu, pinky, golu]
    fallback_sources: []
    mood: bright, colourful, wonder and discovery
  rhyme:
    genre: kids_rhyme
    label: {hindi: एक प्यारी कविता, english: Hindi Rhyme}
    brief: >-
      a NEW original, cheerful Hindi rhyme (बाल गीत) for small children about everyday Indian
      life, nature, animals or good habits, with short rhyming couplets and a catchy repeated
      line; do NOT copy any existing song or poem; the last line is a happy closing line
    allowed: [chintu, pinky, golu, mendhak, chidiya]
    fallback_sources: ["Original rhyme"]
    mood: bright cheerful colours, playful
  riddle:
    genre: kids_story
    label: {hindi: अकबर-बीरबल / तेनाली की पहेली, english: Riddle Story}
    brief: >-
      a NEW riddle story in the style of the Akbar-Birbal or Tenali Raman tales: the king asks a
      tricky question or riddle, courtiers fail, and Birbal (or Tenali Raman) answers it with
      wit; let the children try to guess before the answer; end with a moral
    allowed: [akbar, birbal, tenali, raja]
    fallback_sources: [Akbar-Birbal, Tenali Raman]
    mood: bright warm palace light

storygen:
  model: gemini-2.5-flash
  tries: 3
  review: true                # a second Gemini request double-checks every story is kid-safe
  words: {short: [75, 105], long: [780, 950]}   # spoken Hindi words: 45-55 s / 5-7 min
  lines: {short: [6, 10], long: [40, 70]}
  scenes: {short: [2, 4], long: [10, 18]}
  unsafe_words: [खून, हत्या, मार डाल, मार दिया, मर गया, मर गई, मौत, लाश, भूत, चुड़ैल, डरावन, बंदूक,
                 चाकू, गोली, शराब, सिगरेट, kill, blood, dead, death, ghost, gun, knife, murder, alcohol]

# ---------------------------------------------------------------------------
# Publishing (python -m harmis.publish). Secrets are NEVER stored here: they come
# from environment variables / GitHub or Codespaces secrets (see README).
# ---------------------------------------------------------------------------
publish:
  channel_name: Kahani Khazana   # used in descriptions, captions and tags
  youtube:
    # Privacy of new uploads (YouTube "privacyStatus"): private | unlisted | public
    # Until Google approves the YouTube API audit, YouTube itself keeps API uploads
    # private anyway; after approval they go public automatically.
    privacy: public
    category_id: "27"         # 27 = Education
    language: hi
    thumbnail_for_long: true  # upload a custom thumbnail (title card) for long videos
  instagram:
    graph_api: https://graph.facebook.com/v21.0
    share_to_feed: true
    poll_seconds: 10          # how often to check if Instagram finished processing
    max_wait_seconds: 900
  github:                     # temporary public link for Instagram (a GitHub Release asset)
    api: https://api.github.com
    uploads: https://uploads.github.com
  hashtags:                   # per genre; the best ones first (YouTube uses the first 15)
    kids_story: ["#hindikahani", "#moralstories", "#kidsstories", "#bachonkikahani",
                 "#hindistories", "#kahaniyan", "#cartoon", "#storytime", "#bedtimestories"]
    kids_rhyme: ["#hindirhymes", "#balgeet", "#nurseryrhymes", "#kidssongs", "#hindipoem",
                 "#bachonkegeet", "#kidsrhymes", "#cartoon", "#kids"]
    comedy: ["#hindicomedy", "#funny", "#familycomedy", "#comedy", "#hindistory",
             "#desicomedy", "#cartoon", "#hasya", "#funnyvideo"]
    horror: ["#hindihorror", "#horrorstory", "#bhootkikahani", "#mysterystory", "#hindistory",
             "#scarystory", "#darrkikahani", "#mystery"]
    by_source:                # added only to stories from that folk-tale collection
      Panchatantra: ["#panchatantra", "#panchatantrakahaniya"]
      Jataka: ["#jatakakatha", "#jatakatales"]
      Akbar-Birbal: ["#akbarbirbal", "#birbal"]
      Tenali Raman: ["#tenaliraman", "#tenalirama"]
    by_theme:                 # stories written for a weekday theme
      moral: ["#MoralStory", "#PanchatantraStyle", "#JungleKiKahani"]
      kids_comedy: ["#FunnyKidsStory", "#ChintuGolu", "#MazedarKahani", "#KidsComedy"]
      mythology: ["#KrishnaStory", "#HanumanStory", "#GaneshaStory", "#BalKrishna", "#MythologyForKids"]
      fairy_tale: ["#PariKiKahani", "#FairyTale", "#JaaduiKahani", "#MagicStory"]
      mystery: ["#DetectiveStory", "#JasoosKahani", "#MysteryForKids", "#KidsDetective"]
      science: ["#ScienceForKids", "#SpaceStory", "#VigyanKahani", "#LearnWithFun"]
      rhyme: ["#HindiRhymes", "#BalGeet", "#KidsPoem"]
      riddle: ["#AkbarBirbal", "#TenaliRaman", "#Paheli", "#RiddleStory"]
    always: ["#KahaniKhazana", "#hindi"]
    shorts: ["#shorts"]       # added to YouTube Shorts
    reels: ["#reels", "#reelsindia"]   # added to Instagram Reels

# ---------------------------------------------------------------------------
# Automation (.github/workflows/daily.yml and bulk.yml)
#   daily.yml: 06:30 and 18:30 IST short, 12:30 IST long. It first uploads up to
#              2 videos from the upload queue (GitHub Release "queue"); only when
#              the queue is empty does it make a new video.
#   bulk.yml:  makes many videos at once and puts them in the queue.
# A story is never published twice (see output/published.csv). Stories are taken
# from these genres in turns; horror is left out because this channel is made
# for kids (the horror stories stay in the code for other uses).
# ---------------------------------------------------------------------------
daily:
  lang: hindi
  style: 3d_cartoon
  genres: [kids_story, kids_rhyme, comedy]
  exclude_stories: []           # story ids never to use automatically
  max_uploads_per_day: 5        # free YouTube quota: 10,000 units/day, one upload = 1,600 (+50 thumbnail)
  queue_uploads_per_run: 2      # how many queued videos daily.yml uploads per run
